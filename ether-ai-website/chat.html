<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AETHER · 智能对话</title>
<meta name="theme-color" content="#07182B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff; color: #333; height: 100vh; overflow: hidden; display: flex;
  }

  /* ── 侧边栏 ────────────────────────────── */
  .sidebar {
    width: 260px; background: #07182B;
    display: flex; flex-direction: column; height: 100%;
    transition: width .25s ease, opacity .25s; overflow: hidden;
    flex-shrink: 0;
  }
  .sidebar.collapsed { width: 0; }
  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
  }
  .logo-container { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; color: #fff; }
  .logo-container img { width: 26px; height: 26px; border-radius: 6px; }
  .header-actions { display: flex; gap: 12px; color: rgba(255,255,255,.7); cursor: pointer; align-items: center; }
  .header-actions svg { width: 18px; height: 18px; }

  .new-chat-btn {
    margin: 10px 20px; padding: 10px 16px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); border-radius: 20px;
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: #fff; cursor: pointer; transition: background .2s;
  }
  .new-chat-btn:hover { background: rgba(255,255,255,.18); }
  .new-chat-btn svg { width: 16px; height: 16px; }

  .history-list { flex: 1; overflow-y: auto; padding: 0 12px; }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 4px; }
  .history-group { margin-bottom: 8px; }
  .group-title { font-size: 12px; color: rgba(255,255,255,.45); padding: 10px 8px 4px; }
  .history-item {
    padding: 10px 12px; font-size: 13px; color: rgba(255,255,255,.85);
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2px;
  }
  .history-item:hover { background: rgba(255,255,255,.08); }
  .history-item.active { background: rgba(255,255,255,.14); color: #fff; }
  .history-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .pin { font-size: 11px; margin-right: 4px; }
  .history-item .menu {
    opacity: 0; border: none; background: none; cursor: pointer;
    color: rgba(255,255,255,.6); font-size: 16px; padding: 0 4px; line-height: 1;
  }
  .history-item:hover .menu { opacity: 1; }
  .history-item .chk { width: 16px; height: 16px; margin-right: 6px; accent-color: #2E6BE6; }

  .batch-bar {
    display: none; align-items: center; gap: 10px;
    padding: 10px 16px; border-top: 1px solid rgba(255,255,255,.1); background: #07182B;
  }
  .batch-bar.show { display: flex; }
  .batch-bar button {
    padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.2);
    background: transparent; color: #fff; cursor: pointer; font-size: 12px;
  }
  .batch-bar .cnt { flex: 1; color: rgba(255,255,255,.6); font-size: 12px; }
  .batch-bar .danger { color: #fca5a5; border-color: #fca5a5; }

  .user-profile {
    padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #2E6BE6; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
  }
  .username { font-size: 14px; color: #fff; }
  .user-profile .more { color: rgba(255,255,255,.5); }

  /* ── 主区 ────────────────────────────── */
  .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; background: #F7F8FA; }
  .topbar {
    height: 52px; display: flex; align-items: center;
    padding: 0 20px; gap: 10px; flex-shrink: 0;
  }
  .topbar .toggle-sidebar {
    width: 34px; height: 34px; border-radius: 8px; border: none;
    background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .topbar .toggle-sidebar:hover { background: #f0f0f0; }
  .topbar .toggle-sidebar svg { width: 18px; height: 18px; }
  .topbar .spacer { flex: 1; }
  .topbar a { color: #6b6b6b; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
  .topbar a:hover { background: #f0f0f0; color: #1a1a1a; }

  /* 欢迎页 */
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px;
  }
  .greeting { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
  .greeting img { width: 36px; height: 36px; border-radius: 8px; }
  .greeting-text { font-size: 26px; font-weight: 600; color: #1a1a1a; }

  /* 输入框（通用） */
  .input-container {
    width: 100%; max-width: 760px;
    background: #fff; border: 1px solid #e5e5e5; border-radius: 16px;
    padding: 14px 16px; box-shadow: 0 4px 20px rgba(0,0,0,.03);
    display: flex; flex-direction: column; gap: 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-container:focus-within {
    border-color: #4f46e5; box-shadow: 0 4px 20px rgba(79,70,229,.1);
  }
  .chat-input {
    width: 100%; border: none; outline: none; resize: none;
    font-size: 15px; color: #333; min-height: 24px; max-height: 160px;
    font-family: inherit; line-height: 1.5; background: transparent;
  }
  .chat-input::placeholder { color: #999; }
  .input-actions { display: flex; justify-content: space-between; align-items: center; }
  .left-actions, .right-actions { display: flex; align-items: center; gap: 10px; }
  .feature-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 20px;
    background: #F3F4F6; font-size: 13px; color: #7D8592; cursor: pointer;
    transition: all .15s;
  }
  .feature-btn:hover { background: #eef2ff; }
  .feature-btn.active {
    background: #EEF2FF; border-color: #2E6BE6; color: #2E6BE6;
  }
  .feature-btn svg { width: 14px; height: 14px; }
  .send-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: #e5e5e5; color: #fff; border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .2s;
  }
  .send-btn.ready { background: #4f46e5; }
  .send-btn svg { width: 16px; height: 16px; }
  .icon-btn {
    background: transparent; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #999; padding: 6px; border-radius: 50%;
  }
  .icon-btn:hover { color: #333; background: #f0f0f0; }
  .icon-btn svg { width: 18px; height: 18px; }
  .attach-chips { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .attach-chips.show { display: flex; }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; background: #f0f4ff; color: #4f46e5;
    border-radius: 12px; font-size: 12px; max-width: 220px;
  }
  .attach-chip .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip .rm { cursor: pointer; font-weight: bold; }

  /* 聊天视图 */
  .chat-wrap { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .chat { flex: 1; overflow-y: auto; }
  .chat-inner { max-width: 760px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;
  }
  .msg.user .avatar { background: #e8e8e8; color: #555; }
  .msg.assistant .avatar img { width: 28px; height: 28px; border-radius: 6px; }
  .msg .bubble {
    padding: 10px 14px; font-size: 15px; line-height: 1.6; word-break: break-word;
    max-width: 75%;
    border-radius: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .msg.user .bubble {
    background: #2E6BE6; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: #fff; color: #101318;
    border-bottom-left-radius: 4px;
  }

  /* Markdown */
  .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 6px; line-height: 1.3; }
  .bubble h1 { font-size: 20px; } .bubble h2 { font-size: 17px; } .bubble h3 { font-size: 15px; }
  .bubble p { margin: 6px 0; }
  .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0; }
  .bubble li { margin: 3px 0; }
  .bubble code { background: #f0f0f3; padding: 2px 6px; border-radius: 4px; font-family: "SF Mono", Consolas, monospace; font-size: 13px; }
  .bubble pre { background: #1e1e2e; color: #e4e4e4; padding: 14px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
  .bubble pre code { background: transparent; color: inherit; padding: 0; }
  .bubble table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 14px; }
  .bubble th, .bubble td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
  .bubble th { background: #f5f5f5; }
  .bubble blockquote { border-left: 3px solid #ccc; padding-left: 12px; margin: 10px 0; color: #666; }

  .chat-input-bar {
    flex-shrink: 0; padding: 12px 20px 18px;
  }
  .offline-warn {
    max-width: 760px; margin: 0 auto 10px;
    background: #fff3cd; border: 1px solid #ffc107; color: #856404;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none;
  }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: #999; animation: blink 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

  /* ── 手机版（DeepSeek 风格） ── */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
      width: 280px !important; max-width: 85vw;
      box-shadow: 2px 0 16px rgba(0,0,0,.08);
      transform: translateX(-100%);
      transition: transform .25s ease;
    }
    .sidebar.mobile-open { transform: translateX(0); }
    .backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.3); z-index: 99;
    }
    .backdrop.show { display: block; }

    .topbar { display: none !important; }
    .mobile-topbar { display: flex !important; align-items: center; justify-content: space-between; padding: 10px 16px; }
    .mobile-icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff; border: 1px solid #eee;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }
    .mobile-icon-btn svg { width: 20px; height: 20px; color: #333; }

    .welcome { padding: 10px 16px 20px; }
    .greeting { flex-direction: column; gap: 14px; margin-bottom: 30px; }
    .greeting img { width: 56px; height: 56px; border-radius: 14px; }
    .greeting-text { font-size: 22px; font-weight: 500; color: #101318; }

    .input-container { border-radius: 24px; padding: 14px; box-shadow: none; border: none; background: #fff; }
    .feature-btn { padding: 7px 12px; font-size: 13px; background: #EEF2FF; border-color: transparent; color: #2E6BE6; }
    .feature-btn.active { background: #DDE6FF; }
    .send-btn { width: 36px; height: 36px; }

    .mobile-icon-btn {
      background: #fff !important; border: none !important;
      box-shadow: 0 2px 10px rgba(0,0,0,.06) !important;
    }
    .mobile-topbar { padding: 8px 12px; }
    .voice-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: #fff; border: 1px solid #e5e7eb;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .voice-btn svg { width: 18px; height: 18px; color: #555; }
    #voiceBtn1 { display: flex !important; }
    .chat-input-bar .voice-btn { display: flex !important; }

    .chat-inner { padding: 16px 14px; }
    .msg .bubble { font-size: 15px; }
    .chat-input-bar { padding: 8px 12px 14px; }
    .topbar .spacer ~ a { display: none; }
  }
  @media (min-width: 769px) {
    .mobile-topbar, .backdrop { display: none !important; }
  }

  /* 右键菜单 */
  .ctx-menu {
    position: fixed; background: #fff; border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 6px 0;
    min-width: 160px; z-index: 1000; font-size: 14px;
  }
  .ctx-menu button {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 16px; background: none; border: none;
    cursor: pointer; color: #333; font-size: 14px; text-align: left;
  }
  .ctx-menu button:hover { background: #f5f5f5; }
  .ctx-menu button.danger { color: #dc2626; }
</style>
</head>
<body>

<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-container"><img src="logo.png">AETHER</div>
    <div class="header-actions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <svg class="toggle" onclick="toggleSidebar()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
    </div>
  </div>
  <button class="new-chat-btn" onclick="newChat()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    开启新对话
  </button>
  <div class="history-list" id="chatList"></div>
  <div class="batch-bar" id="batchBar">
    <button onclick="exitMulti()">取消</button>
    <span class="cnt" id="batchCount">已选 0</span>
    <button class="danger" onclick="deleteSelected()">删除所选</button>
  </div>
  <div class="user-profile" id="userProfile">
    <div class="user-info">
      <div class="avatar">A</div>
      <span class="username">Aether User</span>
    </div>
    <svg class="more" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" style="width:16px;height:16px;cursor:pointer;"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
  </div>
</aside>

<main class="main-content">
  <div class="topbar">
    <button class="toggle-sidebar" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="2.5"/></svg>
    </button>
    <div class="spacer"></div>
    <a href="index.html">← 返回官网</a>
  </div>

  <div class="mobile-topbar">
    <button class="mobile-icon-btn" onclick="toggleSidebar()" title="菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <button class="mobile-icon-btn" onclick="newChat()" title="新对话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
  </div>

  <div class="offline-warn" id="warn">⚠️ 后端未连接。运行 <code>python server.py</code>。</div>

  <div class="welcome" id="welcome">
    <div class="greeting">
      <div class="greeting-text">你好，让我们开始聊天吧</div>
    </div>
    <div class="input-container">
      <div class="attach-chips" id="chips1"></div>
      <textarea class="chat-input" id="input1" placeholder="发消息或按住说话" rows="1"></textarea>
      <div class="input-actions">
        <div class="left-actions">
          <button class="feature-btn" data-mode="think">深度思考</button>
          <button class="feature-btn" data-mode="search">联网搜索</button>
        </div>
        <div class="right-actions">
          <button class="voice-btn" style="display:none" id="voiceBtn1" title="语音">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>
          </button>
          <button class="icon-btn" id="attachBtn1" title="上传文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          </button>
          <input type="file" id="fileInput1" multiple accept="*/*" style="display:none">
          <button class="send-btn" id="send1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-wrap" id="chatWrap">
    <div class="chat" id="chat">
      <div class="chat-inner" id="chatInner"></div>
    </div>
    <div class="chat-input-bar">
      <div class="input-container">
        <div class="attach-chips" id="chips2"></div>
        <textarea class="chat-input" id="input2" placeholder="继续追问 AETHER…" rows="1"></textarea>
        <div class="input-actions">
          <div class="left-actions">
            <button class="feature-btn" data-mode="think">深度思考</button>
            <button class="feature-btn" data-mode="search">联网搜索</button>
          </div>
          <div class="right-actions">
            <button class="icon-btn" id="attachBtn2" title="上传文件">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <input type="file" id="fileInput2" multiple accept="*/*" style="display:none">
            <button class="send-btn" id="send2">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
marked.setOptions({ breaks: true, gfm: true });

const sidebar = document.getElementById('sidebar');
const welcome = document.getElementById('welcome');
const chatWrap = document.getElementById('chatWrap');
const chat = document.getElementById('chat');
const chatInner = document.getElementById('chatInner');
const chatList = document.getElementById('chatList');
const input1 = document.getElementById('input1');
const input2 = document.getElementById('input2');
const send1 = document.getElementById('send1');
const send2 = document.getElementById('send2');
const warn = document.getElementById('warn');

const STORAGE_KEY = 'aether_chats_v1';
let chats = loadChats();
let currentId = null;
let multiMode = false;
let selected = new Set();

function loadChats() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
function saveChats() { localStorage.setItem(STORAGE_KEY, JSON.stringify(chats)); }
function getCurrent() { return chats.find(c => c.id === currentId); }
function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function escapeHtml(s) { return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toggleSidebar() {
  sidebar.classList.toggle('mobile-open');
  document.getElementById('backdrop').classList.toggle('show', sidebar.classList.contains('mobile-open'));
  if (window.innerWidth > 768) sidebar.classList.toggle('collapsed');
}

function newChat() {
  const c = { id: 'c_' + Date.now().toString(36), title: '新对话', messages: [], updatedAt: Date.now() };
  chats.unshift(c); saveChats(); currentId = c.id;
  renderList();
  welcome.style.display = 'flex'; chatWrap.style.display = 'none';
  chatInner.innerHTML = ''; input1.focus();
}

function selectChat(id) {
  currentId = id;
  const c = getCurrent(); if (!c) return;
  renderList();
  if (c.messages.length === 0) {
    welcome.style.display = 'flex'; chatWrap.style.display = 'none'; chatInner.innerHTML = '';
  } else {
    welcome.style.display = 'none'; chatWrap.style.display = 'flex'; chatInner.innerHTML = '';
    c.messages.forEach(m => addMsg(m.role, m.content));
  }
}

function deleteChat(id, ev) {
  ev && ev.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  if (currentId === id) currentId = null;
  selected.delete(id); saveChats(); renderList();
  if (currentId == null) { welcome.style.display = 'flex'; chatWrap.style.display = 'none'; chatInner.innerHTML = ''; }
}
function renameChat(id) {
  const c = chats.find(x => x.id === id); if (!c) return;
  const name = prompt('重命名对话：', c.title);
  if (name && name.trim()) { c.title = name.trim(); saveChats(); renderList(); }
}
function togglePin(id) {
  const c = chats.find(x => x.id === id); if (!c) return;
  c.pinned = !c.pinned; c.updatedAt = Date.now(); saveChats(); renderList();
}
function shareChat(id) {
  const c = chats.find(x => x.id === id); if (!c) return;
  const text = c.messages.map(m => (m.role === 'user' ? '你：' : 'AETHER：') + m.content).join('\n\n');
  navigator.clipboard.writeText(text).then(() => alert('对话已复制到剪贴板'))
    .catch(() => prompt('复制：', text));
}
function enterMulti() { multiMode = true; selected.clear(); renderList(); }
function exitMulti() { multiMode = false; selected.clear(); renderList(); }
function toggleSelect(id, ev) { ev.stopPropagation(); selected.has(id) ? selected.delete(id) : selected.add(id); renderList(); }
function deleteSelected() {
  if (!selected.size) return;
  if (!confirm(`删除选中的 ${selected.size} 条对话？`)) return;
  chats = chats.filter(c => !selected.has(c.id));
  if (selected.has(currentId)) currentId = null;
  selected.clear(); multiMode = false; saveChats(); renderList();
  if (currentId == null) { welcome.style.display = 'flex'; chatWrap.style.display = 'none'; chatInner.innerHTML = ''; }
}

let ctxEl = null;
function openCtxMenu(id, x, y) {
  closeCtxMenu();
  const c = chats.find(t => t.id === id);
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.innerHTML = `
    <button data-a="rename">✏️ 重命名</button>
    <button data-a="pin">📌 ${c && c.pinned ? '取消置顶' : '置顶'}</button>
    <button data-a="share">🔗 分享</button>
    <button data-a="multi">☑️ 多选</button>
    <button data-a="del" class="danger">🗑 删除</button>`;
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
  menu.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const a = b.dataset.a; closeCtxMenu();
    if (a === 'rename') renameChat(id);
    else if (a === 'pin') togglePin(id);
    else if (a === 'share') shareChat(id);
    else if (a === 'multi') enterMulti();
    else if (a === 'del') deleteChat(id);
  });
  document.body.appendChild(menu); ctxEl = menu;
  setTimeout(() => document.addEventListener('click', closeCtxMenu), 0);
}
function closeCtxMenu() { if (ctxEl) { ctxEl.remove(); ctxEl = null; } document.removeEventListener('click', closeCtxMenu); }

function renderList() {
  chatList.innerHTML = '';
  document.getElementById('batchBar').classList.toggle('show', multiMode);
  document.getElementById('batchCount').textContent = '已选 ' + selected.size;
  const now = new Date();
  const pinned = chats.filter(c => c.pinned);
  const rest = chats.filter(c => !c.pinned);
  function draw(label, items) {
    if (!items.length) return;
    const lab = document.createElement('div'); lab.className = 'group-title'; lab.textContent = label;
    chatList.appendChild(lab);
    items.forEach(c => chatList.appendChild(buildItem(c)));
  }
  if (pinned.length) draw('置顶', pinned);
  draw('今天', rest.filter(c => isSameDay(new Date(c.updatedAt), now)));
  draw('昨天', rest.filter(c => isSameDay(new Date(c.updatedAt), new Date(now - 86400000))));
  draw('7 天内', rest.filter(c => now - new Date(c.updatedAt) < 7 * 86400000));
  draw('更早', rest.filter(c => now - new Date(c.updatedAt) >= 7 * 86400000));
}
function buildItem(c) {
  const item = document.createElement('div');
  item.className = 'history-item' + (c.id === currentId ? ' active' : '');
  const chk = multiMode ? `<input type="checkbox" class="chk" ${selected.has(c.id) ? 'checked' : ''}>` : '';
  const pin = c.pinned ? '<span class="pin">📌</span>' : '';
  item.innerHTML = `${chk}<span class="t">${pin}${escapeHtml(c.title)}</span><button class="menu">⋯</button>`;
  item.onclick = e => { if (multiMode) { toggleSelect(c.id, e); return; } selectChat(c.id); };
  item.querySelector('.menu').onclick = e => {
    e.stopPropagation();
    if (multiMode) { toggleSelect(c.id, e); return; }
    const r = e.currentTarget.getBoundingClientRect();
    openCtxMenu(c.id, Math.min(r.right - 170, window.innerWidth - 180), r.bottom + 4);
  };
  return item;
}

function bindInput(inp, btn) {
  inp.addEventListener('input', () => {
    btn.classList.toggle('ready', !!inp.value.trim());
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 160) + 'px';
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(inp.value, inp); }
  });
  btn.addEventListener('click', () => sendMsg(inp.value, inp));
}
bindInput(input1, send1);
bindInput(input2, send2);

// ── 附件上传 ──
const MAX_FILES = 50;
const MAX_SIZE = 100 * 1024 * 1024; // 100MB
let attached = []; // {name, size}

function fmtSize(b) {
  if (b < 1024) return b + 'B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + 'KB';
  return (b/1024/1024).toFixed(1) + 'MB';
}
function renderChips() {
  [['chips1', input1], ['chips2', input2]].forEach(([cid]) => {
    const box = document.getElementById(cid);
    box.classList.toggle('show', attached.length > 0);
    box.innerHTML = attached.map((f, i) =>
      `<span class="attach-chip"><span>📎</span><span class="fn">${escapeHtml(f.name)}</span><span style="opacity:.6">${fmtSize(f.size)}</span><span class="rm" data-i="${i}">×</span></span>`
    ).join('');
    box.querySelectorAll('.rm').forEach(x => x.onclick = () => {
      attached.splice(+x.dataset.i, 1); renderChips();
    });
  });
}
function handleFiles(list) {
  const files = Array.from(list);
  for (const f of files) {
    if (attached.length >= MAX_FILES) { alert(`最多上传 ${MAX_FILES} 个文件`); break; }
    if (f.size > MAX_SIZE) { alert(`"${f.name}" 超过 100MB，已跳过`); continue; }
    attached.push({ name: f.name, size: f.size });
  }
  renderChips();
}
document.getElementById('attachBtn1').onclick = () => document.getElementById('fileInput1').click();
document.getElementById('attachBtn2').onclick = () => document.getElementById('fileInput2').click();
document.getElementById('fileInput1').onchange = e => { handleFiles(e.target.files); e.target.value=''; };
document.getElementById('fileInput2').onchange = e => { handleFiles(e.target.files); e.target.value=''; };
document.querySelectorAll('.feature-btn').forEach(b => {
  b.addEventListener('click', () => {
    b.classList.toggle('active');
  });
});

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const av = role === 'user' ? '你' : '<img src="logo.png">';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'user') bubble.textContent = text;
  else bubble.innerHTML = marked.parse(text || '');
  div.innerHTML = `<div class="avatar">${av}</div>`;
  div.appendChild(bubble);
  chatInner.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMsg(text, source) {
  text = (text || '').trim(); if (!text && !attached.length) return;
  if (!currentId) newChat();
  const c = getCurrent();
  const filesNote = attached.length
    ? '\n\n[附件] ' + attached.map(f => `${f.name} (${fmtSize(f.size)})`).join('、')
    : '';
  const fullText = text + filesNote;
  const displayText = text || '（上传了 ' + attached.length + ' 个文件）';
  if (!currentId) newChat();
  const c = getCurrent();
  welcome.style.display = 'none'; chatWrap.style.display = 'flex';
  addMsg('user', displayText);
  c.messages.push({ role: 'user', content: displayText });
  if (c.messages.filter(m => m.role === 'user').length === 1) c.title = (text || '附件').slice(0, 22);
  c.updatedAt = Date.now(); saveChats(); renderList();
  const sentFiles = attached.slice();
  attached = []; renderChips();
  source.value = ''; source.dispatchEvent(new Event('input'));

  const assistant = addMsg('assistant', '');
  const bubble = assistant.querySelector('.bubble');
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  try {
    const r = await fetch('http://localhost:8001/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: fullText, history: c.messages.slice(0, -1) })
    });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    bubble.innerHTML = marked.parse(data.reply || '');
    c.messages.push({ role: 'assistant', content: data.reply });
    c.updatedAt = Date.now(); saveChats(); renderList();
  } catch (e) {
    warn.style.display = 'block';
    bubble.textContent = '⚠️ 无法连接后端。';
  }
  chat.scrollTop = chat.scrollHeight;
  input2.focus();
}

if (chats.length) selectChat(chats[0].id); else renderList();

document.getElementById('userProfile').addEventListener('click', e => {
  e.stopPropagation();
  closeCtxMenu();
  const r = e.currentTarget.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.innerHTML = `
    <button data-a="app">📱 手机下载 APP</button>
    <button data-a="settings">⚙️ 系统设置</button>
    <button data-a="help">💬 帮助与反馈</button>
    <button data-a="logout" class="danger">🚪 退出登录</button>`;
  menu.style.left = '16px';
  menu.style.top = (r.top - 220) + 'px';
  menu.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const a = b.dataset.a; closeCtxMenu();
    if (a === 'app') alert('APP 即将上线，敬请期待。');
    else if (a === 'settings') alert('设置：后端地址 = http://localhost:8001');
    else if (a === 'help') alert('反馈邮箱：2100393959@qq.com');
    else if (a === 'logout') {
      if (confirm('退出登录？将清空本地对话记录。')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    }
  });
  document.body.appendChild(menu); ctxEl = menu;
  setTimeout(() => document.addEventListener('click', closeCtxMenu), 0);
});
</script>
