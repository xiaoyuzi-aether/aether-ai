<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER · 以太</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f7f8; color: #1a1a1a;
    height: 100vh; display: flex; overflow: hidden;
  }
  .sidebar {
    width: 260px; background: #1a1a1a; color: #ccc;
    display: flex; flex-direction: column; flex-shrink: 0;
    transition: width .2s, opacity .2s; overflow: hidden;
  }
  .sidebar.collapsed { width: 0; opacity: 0; }
  .sidebar-header {
    padding: 16px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .sidebar-header .title { font-weight: 700; font-size: 14px; color: #fff; }
  .new-chat-btn {
    margin: 12px; padding: 10px; border-radius: 10px;
    background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.1);
    cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px;
    transition: background .15s;
  }
  .new-chat-btn:hover { background: rgba(255,255,255,.15); }
  .chat-history { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .chat-item {
    padding: 8px 10px; border-radius: 8px; font-size: 13px;
    cursor: pointer; margin-bottom: 4px; color: #aaa;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-item:hover { background: rgba(255,255,255,.08); color: #fff; }
  .chat-item.active { background: rgba(110,231,255,.15); color: #6ee7ff; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 52px; background: #fff; border-bottom: 1px solid #e5e5e5;
    display: flex; align-items: center; padding: 0 16px; gap: 10px; flex-shrink: 0;
  }
  .toggle-btn {
    background: none; border: none; cursor: pointer; padding: 6px;
    border-radius: 6px; color: #666;
  }
  .toggle-btn:hover { background: #f0f0f0; }
  .toggle-btn svg { width: 18px; height: 18px; }
  .topbar .logo { font-weight: 700; font-size: 16px; display: flex; align-items: center; }
  .topbar .spacer { flex: 1; }
  .topbar a { color: #6b6b6b; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
  .topbar a:hover { background: #f0f0f0; color: #1a1a1a; }

  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .center-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 20px;
  }
  .center-area h1 { font-size: 28px; font-weight: 700; margin-bottom: 30px; }
  .chat-view { flex: 1; overflow-y: auto; display: none; }
  .chat-view.active { display: block; }
  .chat-inner { max-width: 760px; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; }

  .input-area {
    flex-shrink: 0; padding: 16px 20px 20px;
    background: linear-gradient(transparent, #f7f7f8 30%);
  }
  .input-box {
    max-width: 760px; margin: 0 auto;
    background: #fff; border: 1px solid #e5e5e5; border-radius: 16px;
    padding: 16px 16px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.04);
  }
  .input-box textarea {
    width: 100%; border: none; outline: none; resize: none;
    font-size: 15px; font-family: inherit; line-height: 1.5;
    max-height: 160px; background: transparent; color: #1a1a1a;
  }
  .input-box-bottom { display: flex; align-items: center; margin-top: 10px; }
  .preset-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-chips button {
    padding: 5px 12px; border-radius: 999px; border: 1px solid #e0e0e0;
    background: #fff; font-size: 12px; color: #666; cursor: pointer; transition: all .15s;
  }
  .preset-chips button:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .send-btn {
    margin-left: auto; width: 34px; height: 34px; border-radius: 8px;
    background: #1a1a1a; color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .send-btn:disabled { opacity: .3; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }

  .msg { display: flex; gap: 12px; max-width: 100%; }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg.user .avatar { background: #e8e8e8; color: #555; }
  .msg.assistant .avatar { background: transparent; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 10px;
    font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #fff; border: 1px solid #e5e5e5; }
  .msg.assistant .bubble { background: transparent; padding: 10px 0; }

  .offline-warn {
    background: #fff3cd; border: 1px solid #ffc107; color: #856404;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: #999; animation: blink 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="title">对话记录</div>
  </div>
  <button class="new-chat-btn" onclick="newChat()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    开启新对话
  </button>
  <div class="chat-history" id="chatHistory"></div>
</div>

<div class="main">
  <div class="topbar">
    <button class="toggle-btn" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="logo"><img src="logo.png" style="width:28px;height:28px;border-radius:6px;vertical-align:middle;margin-right:8px">AETHER</div>
    <div class="spacer"></div>
    <a href="index.html">← 返回官网</a>
  </div>

  <div class="chat-area">
    <div class="center-area" id="centerArea">
      <div class="offline-warn" id="warn">⚠️ 后端未连接（localhost:8000）。运行 <code>python server.py</code> 启动。</div>
      <h1>HI,好久不见~</h1>
    </div>
    <div class="chat-view" id="chatView">
      <div class="chat-inner" id="chatInner"></div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="input" rows="1" placeholder="给 AETHER 布置一个任务…"></textarea>
      <div class="input-box-bottom">
        <div class="preset-chips">
          <button data-q="用 Python 写一个快速排序">写代码</button>
          <button data-q="帮我写一条朋友圈文案">写文案</button>
        </div>
        <button class="send-btn" id="send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const sidebar = document.getElementById('sidebar');
const centerArea = document.getElementById('centerArea');
const chatView = document.getElementById('chatView');
const chatInner = document.getElementById('chatInner');
const input = document.getElementById('input');
const send = document.getElementById('send');
const warn = document.getElementById('warn');
const history = [];
const conversations = [];
let currentConv = null;

function toggleSidebar() { sidebar.classList.toggle('collapsed'); }

function newChat() {
  if (currentConv) {
    currentConv.messages = history.slice();
    conversations.unshift(currentConv);
    renderHistory();
  }
  history.length = 0;
  chatInner.innerHTML = '';
  centerArea.style.display = 'flex';
  chatView.classList.remove('active');
  input.value = ''; send.disabled = true;
}

function renderHistory() {
  const el = document.getElementById('chatHistory');
  el.innerHTML = conversations.map((c,i) =>
    `<div class="chat-item" onclick="loadConv(${i})">${c.title}</div>`
  ).join('');
}
function loadConv(i) {
  const c = conversations[i];
  history.splice(0, history.length, ...c.messages);
  chatInner.innerHTML = '';
  c.messages.forEach(m => addMsg(m.role, m.content));
  centerArea.style.display = 'none';
  chatView.classList.add('active');
}

input.addEventListener('input', () => {
  send.disabled = !input.value.trim();
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
send.addEventListener('click', sendMsg);
document.querySelectorAll('.preset-chips button').forEach(b => {
  b.addEventListener('click', () => { input.value = b.dataset.q; input.dispatchEvent(new Event('input')); sendMsg(); });
});

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? '你' : '<img src="logo.png" style="width:20px;height:20px;border-radius:4px">';
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${text}</div>`;
  chatInner.appendChild(div);
  chatView.scrollTop = chatView.scrollHeight;
  return div;
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.dispatchEvent(new Event('input'));

  if (!currentConv) currentConv = { title: text.slice(0, 20), messages: [] };
  centerArea.style.display = 'none';
  chatView.classList.add('active');

  addMsg('user', text);
  history.push({role: 'user', content: text});

  const assistant = addMsg('assistant', '<div class="typing"><span></span><span></span><span></span></div>');
  const bubble = assistant.querySelector('.bubble');

  try {
    const r = await fetch('http://127.0.0.1:8000/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, history: history.slice(0, -1)})
    });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    bubble.textContent = data.reply;
    history.push({role: 'assistant', content: data.reply});
  } catch (e) {
    warn.style.display = 'block';
    bubble.innerHTML = '⚠️ 无法连接后端。请运行 <code>python server.py</code>。';
  }
  chatView.scrollTop = chatView.scrollHeight;
}
</script>
</body>
</html>
