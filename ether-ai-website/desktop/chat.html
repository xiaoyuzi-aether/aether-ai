<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER · 以太</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f7f8; color: #1a1a1a;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .topbar {
    height: 52px; background: #fff; border-bottom: 1px solid #e5e5e5;
    display: flex; align-items: center; padding: 0 16px; gap: 8px; flex-shrink: 0;
  }
  .topbar .icon-btn {
    width: 34px; height: 34px; border: none; background: transparent;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #555;
  }
  .topbar .icon-btn:hover { background: #f0f0f0; }
  .topbar .icon-btn svg { width: 20px; height: 20px; }
  .topbar .logo { font-weight: 700; font-size: 16px; display: flex; align-items: center; }
  .topbar .spacer { flex: 1; }
  .topbar a { color: #6b6b6b; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
  .topbar a:hover { background: #f0f0f0; color: #1a1a1a; }

  .main { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 260px; background: #fff; border-right: 1px solid #e5e5e5;
    display: flex; flex-direction: column; flex-shrink: 0;
    transition: margin-left .25s ease;
  }
  .sidebar.closed { margin-left: -260px; }
  .sidebar .new-chat {
    margin: 12px; padding: 10px 14px; border: 1px solid #e5e5e5; border-radius: 10px;
    background: #fafafa; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; gap: 8px; transition: all .15s;
  }
  .sidebar .new-chat:hover { background: #f0f0f0; }
  .sidebar .new-chat svg { width: 16px; height: 16px; }
  .sidebar .history { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .sidebar .history-title { font-size: 12px; color: #999; padding: 8px 4px; }
  .sidebar .history-item {
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
    cursor: pointer; color: #444; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar .history-item:hover { background: #f0f0f0; }
  .sidebar .history-item.active { background: #e8e8e8; color: #1a1a1a; }

  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .chat { flex: 1; overflow-y: auto; }
  .chat-inner { max-width: 760px; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; }

  .msg { display: flex; gap: 12px; max-width: 100%; }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
  }
  .msg.user .avatar { background: #e8e8e8; color: #555; }
  .msg.assistant .avatar { background: transparent; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 10px;
    font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #fff; border: 1px solid #e5e5e5; }
  .msg.assistant .bubble { background: transparent; padding: 10px 0; }

  .center-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .center-area h1 { font-size: 28px; font-weight: 700; margin-bottom: 30px; }

  .input-bar { flex-shrink: 0; padding: 16px 20px 20px; }
  .input-box {
    max-width: 760px; margin: 0 auto;
    background: #fff; border: 1px solid #e5e5e5; border-radius: 16px;
    padding: 16px 16px 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .input-box textarea {
    width: 100%; border: none; outline: none; resize: none;
    font-size: 15px; font-family: inherit; line-height: 1.5;
    max-height: 160px; background: transparent; color: #1a1a1a;
  }
  .input-box-bottom { display: flex; align-items: center; margin-top: 10px; }
  .preset-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-chips button {
    padding: 5px 12px; border-radius: 999px; border: 1px solid #e0e0e0;
    background: #fff; font-size: 12px; color: #666; cursor: pointer; transition: all .15s;
  }
  .preset-chips button:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .send-btn {
    margin-left: auto; width: 34px; height: 34px; border-radius: 8px;
    background: #1a1a1a; color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .2s;
  }
  .send-btn:disabled { opacity: .3; cursor: not-allowed; }
  .send-btn svg { width: 16px; height: 16px; }

  .offline-warn {
    background: #fff3cd; border: 1px solid #ffc107; color: #856404;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .typing { display: inline-flex; gap: 4px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: #999; animation: blink 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="toggleSidebar" title="收起/展开">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="logo"><img src="logo.png" style="width:28px;height:28px;border-radius:6px;vertical-align:middle;margin-right:8px">AETHER</div>
  <div class="spacer"></div>
  <a href="index.html">← 返回官网</a>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      开启新对话
    </div>
    <div class="history">
      <div class="history-title">历史对话</div>
      <div id="historyList"></div>
    </div>
  </div>

  <div class="content">
    <div class="center-area" id="centerArea">
      <div class="offline-warn" id="warn">⚠️ 后端未连接。运行 <code>python server.py</code>。</div>
      <h1>HI,好久不见~</h1>
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="给 AETHER 布置一个任务…"></textarea>
        <div class="input-box-bottom">
          <div class="preset-chips">
            <button data-q="用 Python 写一个快速排序">写代码</button>
            <button data-q="帮我写一条朋友圈文案">写文案</button>
          </div>
          <button class="send-btn" id="send" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="chat" id="chat" style="display:none">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="input-bar" id="inputBar" style="display:none">
      <div class="input-box">
        <textarea id="input2" rows="1" placeholder="继续对话…"></textarea>
        <div class="input-box-bottom">
          <div class="preset-chips">
            <button data-q="用 Python 写一个快速排序">写代码</button>
            <button data-q="帮我写一条朋友圈文案">写文案</button>
          </div>
          <button class="send-btn" id="send2" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const sidebar = document.getElementById('sidebar');
const toggleBtn = document.getElementById('toggleSidebar');
const newChatBtn = document.getElementById('newChat');
const centerArea = document.getElementById('centerArea');
const chat = document.getElementById('chat');
const chatInner = document.getElementById('chatInner');
const inputBar = document.getElementById('inputBar');
const input = document.getElementById('input');
const send = document.getElementById('send');
const input2 = document.getElementById('input2');
const send2 = document.getElementById('send2');
const warn = document.getElementById('warn');
const historyList = document.getElementById('historyList');

let conversations = JSON.parse(localStorage.getItem('aether_chats') || '[]');
let currentChat = null;

toggleBtn.addEventListener('click', () => sidebar.classList.toggle('closed'));
newChatBtn.addEventListener('click', newChat);

function renderHistory() {
  historyList.innerHTML = '';
  conversations.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'history-item' + (currentChat === i ? ' active' : '');
    div.textContent = c.title || '新对话';
    div.addEventListener('click', () => loadChat(i));
    historyList.appendChild(div);
  });
}

function newChat() {
  currentChat = null;
  centerArea.style.display = 'flex';
  chat.style.display = 'none';
  inputBar.style.display = 'none';
  input.value = '';
  chatInner.innerHTML = '';
  renderHistory();
}

function loadChat(idx) {
  currentChat = idx;
  const c = conversations[idx];
  centerArea.style.display = 'none';
  chat.style.display = 'block';
  inputBar.style.display = 'block';
  chatInner.innerHTML = '';
  c.messages.forEach(m => addMsg(m.role, m.content));
  renderHistory();
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? '你' : '<img src="logo.png" style="width:20px;height:20px;border-radius:4px">';
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${text}</div>`;
  chatInner.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function bindInput(inp, snd) {
  inp.addEventListener('input', () => {
    snd.disabled = !inp.value.trim();
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 160) + 'px';
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(inp, snd); }
  });
  snd.addEventListener('click', () => doSend(inp, snd));
  inp.parentElement.querySelectorAll('.preset-chips button').forEach(b => {
    b.addEventListener('click', () => { inp.value = b.dataset.q; inp.dispatchEvent(new Event('input')); doSend(inp, snd); });
  });
}
bindInput(input, send);
bindInput(input2, send2);

async function doSend(inp, snd) {
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.dispatchEvent(new Event('input'));

  centerArea.style.display = 'none';
  chat.style.display = 'block';
  inputBar.style.display = 'block';

  if (currentChat === null) {
    conversations.unshift({title: text.slice(0, 20), messages: []});
    currentChat = 0;
  }
  conversations[currentChat].messages.push({role: 'user', content: text});

  addMsg('user', text);
  const assistant = addMsg('assistant', '<div class="typing"><span></span><span></span><span></span></div>');
  const bubble = assistant.querySelector('.bubble');

  try {
    const r = await fetch('http://127.0.0.1:8000/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, history: conversations[currentChat].messages.slice(0, -1)})
    });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    bubble.textContent = data.reply;
    conversations[currentChat].messages.push({role: 'assistant', content: data.reply});
  } catch (e) {
    warn.style.display = 'block';
    bubble.innerHTML = '⚠️ 无法连接后端。运行 <code>python server.py</code>。';
  }
  localStorage.setItem('aether_chats', JSON.stringify(conversations.slice(0, 20)));
  renderHistory();
  chat.scrollTop = chat.scrollHeight;
}

renderHistory();
</script>
</body>
</html>
